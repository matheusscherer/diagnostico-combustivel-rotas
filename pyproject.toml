[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnostico-combustivel-rotas"
version = "1.0.0"
description = "Diagnóstico de combustível e rotas: km extras, custo por entrega e ociosidade de frota"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matheus Scherer", email = "contatomatheusscherer@gmail.com" }]
keywords = ["python", "pandas", "logistica", "combustivel", "rotas", "frota"]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
dashboard = ["streamlit>=1.50"]

[project.scripts]
diagnostico-combustivel-rotas = "diagnostico_combustivel_rotas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
